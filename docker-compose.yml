version: "3.9"

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Seamless
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # This line runs your SQL script to create all 3 databases on startup
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # Added user, password, and explicitly used 127.0.0.1
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pSeamless" ]
      timeout: 10s
      retries: 10
      # Gives MySQL 60 seconds to run the init.sql before it starts checking
      start_period: 60s

  product-service:
    build: ./product-service
    container_name: product-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/product-service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Seamless
    depends_on:
      - mysql-db

  order-service:
    build: ./order-service
    container_name: order-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/order-service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Seamless
      PRODUCT_SERVICE_URL: http://product-service:8081
      NOTIFICATION_URL: http://notification-service:8083
    depends_on:
      - mysql-db
      - product-service
      - notification-service

  notification-service:
    build: ./notification-service
    container_name: notification-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/notification-service
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Seamless
    depends_on:
      - mysql-db

volumes:
  mysql_data:
